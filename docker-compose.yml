name: pedali

services:

  kafka:
    image: apache/kafka:3.9.1
    container_name: pedali-kafka-test
    hostname: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      pedali:
        aliases:
          - kafka
    restart: unless-stopped

  spark-master:
    image: pedali-spark:3.5.3
    container_name: pedali-spark-master
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data:/workspace/data
    networks:
      pedali:
        aliases:
          - spark-master
    restart: unless-stopped

  spark-worker-1:
    image: pedali-spark:3.5.3
    container_name: pedali-spark-worker-1
    hostname: spark-worker-1
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 768m
      - spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./data:/workspace/data
    networks:
      - pedali
    restart: unless-stopped

  spark-worker-2:
    image: pedali-spark:3.5.3
    container_name: pedali-spark-worker-2
    hostname: spark-worker-2
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 768m
      - spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./data:/workspace/data
    networks:
      - pedali
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: pedali-minio-test
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${PEDALI_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${PEDALI_MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      pedali:
        aliases:
          - minio
    restart: unless-stopped

  jupyter:
    image: pedali-jupyter:1.0
    container_name: pedali-jupyter
    hostname: pedali-jupyter
    ports:
      - "8889:8888"
      - "4040:4040"
    volumes:
      - ./:/workspace
    networks:
      pedali:
        aliases:
          - pedali-jupyter
    depends_on:
      - spark-master
    restart: unless-stopped

networks:
  pedali:
    external: true
    name: pedali-test

volumes:
  kafka-data:
    external: true
    name: pedali-kafka-data

  minio-data:
    external: true
    name: pedali-minio-data

